<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-container">

    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">💸 Budget Visualizer</h1>
        <p class="app-subtitle">Lacak pengeluaran Anda</p>
      </div>
      <div class="header-right">
        <div class="total-card">
          <span class="total-label">Total Pengeluaran</span>
          <span class="total-amount" id="totalAmount">Rp 0</span>
        </div>
        <button class="btn-theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">

      <!-- Kolom Kiri: Form + Daftar -->
      <section class="left-panel">

        <!-- Form Input -->
        <div class="card">
          <h2 class="card-title">Tambah Transaksi</h2>
          <form id="expenseForm" novalidate>
            <div class="form-group">
              <label for="itemName">Nama Item</label>
              <input type="text" id="itemName" placeholder="Contoh: Makan siang" autocomplete="off" />
              <span class="error-msg" id="nameError"></span>
            </div>
            <div class="form-group">
              <label for="itemAmount">Jumlah (Rp)</label>
              <input type="number" id="itemAmount" placeholder="Contoh: 50000" min="1" />
              <span class="error-msg" id="amountError"></span>
            </div>
            <div class="form-group">
              <label for="itemCategory">Kategori</label>
              <select id="itemCategory">
                <option value="">-- Pilih Kategori --</option>
                <option value="Makanan">🍔 Makanan</option>
                <option value="Transportasi">🚗 Transportasi</option>
                <option value="Hiburan">🎮 Hiburan</option>
              </select>
              <span class="error-msg" id="categoryError"></span>
            </div>
            <button type="submit" class="btn-primary">+ Tambah</button>
          </form>
        </div>

        <!-- Sorting Controls -->
        <div class="card">
          <div class="list-header">
            <h2 class="card-title">Daftar Transaksi</h2>
            <div class="sort-controls">
              <label for="sortSelect">Urutkan:</label>
              <select id="sortSelect">
                <option value="default">Terbaru</option>
                <option value="amount-asc">Jumlah ↑</option>
                <option value="amount-desc">Jumlah ↓</option>
                <option value="category">Kategori A-Z</option>
              </select>
            </div>
          </div>

          <!-- Transaction List -->
          <div class="transaction-list" id="transactionList">
            <p class="empty-state" id="emptyState">Belum ada transaksi. Tambahkan yang pertama!</p>
          </div>
        </div>

      </section>

      <!-- Kolom Kanan: Chart -->
      <section class="right-panel">
        <div class="card chart-card">
          <h2 class="card-title">Distribusi Pengeluaran</h2>
          <div class="chart-wrapper">
            <canvas id="expenseChart"></canvas>
          </div>
          <p class="chart-empty" id="chartEmpty">Tambahkan transaksi untuk melihat grafik.</p>
        </div>
      </section>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
